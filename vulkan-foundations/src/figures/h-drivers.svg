   </g>
   <g id="text_18">
    <text style="font-size: 6.4px; font-family: 'Source Sans 3'; text-anchor: start; fill: #1b2430" x="266.456693" y="66.85785" transform="rotate(-0 266.456693 66.85785)">compiles SPIR-V into pipelines, ahead of time</text>
   </g>
   <g id="text_19">
    <text style="font-size: 6.4px; font-family: 'Source Sans 3'; text-anchor: start; fill: #1b2430" x="266.456693" y="80.992579" transform="rotate(-0 266.456693 80.992579)">records barriers between dependent work</text>
