   </g>
   <g id="text_14">
    <text style="font-size: 6.4px; font-family: 'Source Sans 3'; text-anchor: start; fill: #ffffff" x="22.677165" y="139.47535" transform="rotate(-0 22.677165 139.47535)">finds hazards and inserts barriers</text>
   </g>
   <g id="text_15">
