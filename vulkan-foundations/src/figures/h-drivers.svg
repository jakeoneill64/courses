   <g id="text_11">
    <text style="font-size: 6.4px; font-family: 'Source Sans 3'; text-anchor: start; fill: #ffffff" x="22.677165" y="89.458016" transform="rotate(-0 22.677165 89.458016)">tracks every object's state and validates every call</text>
   </g>
