   <g id="text_8">
    <text style="font-size: 5.8px; font-family: 'Source Sans 3'; fill: #5a6472" transform="translate(363.49168 158.567703)">owns the images; shows them</text>
    <text style="font-size: 5.8px; font-family: 'Source Sans 3'; fill: #5a6472" transform="translate(362.391492 167.455623)">in the order they are presented</text>
   </g>
   <g id="text_9">
    <text style="font-size: 5.8px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(153.070866 18.252742)">returns an image index; signals</text>
    <text style="font-size: 5.8px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(153.070866 27.132053)">image acquired [frame slot]</text>
   </g>
   <g id="text_10">
    <text style="font-size: 5.8px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(153.070866 64.889045)">waits for image acquired at</text>
    <text style="font-size: 5.8px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(153.070866 73.698574)">COLOR_ATTACHMENT_OUTPUT; signals</text>
    <text style="font-size: 5.8px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(153.070866 82.542994)">ready to present [image]</text>
   </g>
   <g id="text_11">
    <text style="font-size: 5.8px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(153.070866 126.004168)">waits for ready to present [image];</text>
    <text style="font-size: 5.8px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(153.070866 134.813697)">hands the image back</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.2px; font-family: 'Source Sans 3'; text-anchor: start; fill: #1b2430" x="11.338583" y="165.959449" transform="rotate(-0 11.338583 165.959449)">One acquire semaphore per frame in flight; one ready-to-present semaphore per image.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6px; font-family: 'Source Sans 3'; text-anchor: start; fill: #5a6472" x="11.338583" y="178.629261" transform="rotate(-0 11.338583 178.629261)">Only acquiring an image again proves that its last presentation no longer uses its semaphore.</text>
   </g>
