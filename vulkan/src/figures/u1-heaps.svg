   </g>
   <g id="text_6">
    <text style="font-weight: 600; font-size: 7px; font-family: 'Source Sans 3'; text-anchor: middle; fill: #1b2430" x="119.055118" y="103.372047" transform="rotate(-0 119.055118 103.372047)">DEVICE_LOCAL | HOST_VISIBLE</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.2px; font-family: 'Source Sans 3'; text-anchor: middle; fill: #1b2430" x="119.055118" y="110.105494" transform="rotate(-0 119.055118 110.105494)">resizable BAR window, or 256 MiB without it</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 600; font-size: 6.8px; font-family: 'Source Sans 3'; text-anchor: middle; fill: #1b2430" x="119.055118" y="164.266929" transform="rotate(-0 119.055118 164.266929)">HOST_VISIBLE | HOST_COHERENT (| HOST_CACHED)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.2px; font-family: 'Source Sans 3'; text-anchor: middle; fill: #1b2430" x="119.055118" y="170.882782" transform="rotate(-0 119.055118 170.882782)">staging and readback, over PCIe</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 600; font-size: 7px; font-family: 'Source Sans 3'; text-anchor: middle; fill: #1b2430" x="357.165354" y="76.033121" transform="rotate(-0 357.165354 76.033121)">type 0: DEVICE_LOCAL</text>
