   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Source Sans 3'; text-anchor: middle; fill: #bc5090" x="357.165354" y="13.502333" transform="rotate(-0 357.165354 13.502333)">Apple M2 Pro (measured, Chapter 1.2)</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6.6px; font-family: 'Source Sans 3'; fill: #5a6472" transform="translate(304.064229 180.919299)">one pool of memory: the CPU and GPU</text>
    <text style="font-size: 6.6px; font-family: 'Source Sans 3'; fill: #5a6472" transform="translate(304.812401 190.894435)">share it, so staging copies are optional</text>
