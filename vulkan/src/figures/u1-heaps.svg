   <g id="text_12">
    <text style="font-size: 6.6px; font-family: 'Source Sans 3'; text-anchor: middle; fill: #1b2430" x="357.165354" y="115.461024" transform="rotate(-0 357.165354 115.461024)">| HOST_COHERENT | HOST_CACHED</text>
