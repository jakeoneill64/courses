   <g id="text_9">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Source Sans 3'; text-anchor: start; fill: #003f5c" x="5.669291" y="13.130692" transform="rotate(-0 5.669291 13.130692)">Each workgroup computes the forces on its own particles, one tile of sources at a time</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6px; font-family: 'Source Sans 3'; text-anchor: start; fill: #5a6472" x="323.149606" y="52.487528" transform="rotate(-0 323.149606 52.487528)">all particles' positions, in global memory</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6px; font-family: 'Source Sans 3'; text-anchor: start; fill: #1b2430" x="181.417323" y="75.245787" transform="rotate(-0 181.417323 75.245787)">1  every invocation loads one position of the tile into shared memory; barrier</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(238.110236 133.04548)">2  each invocation accumulates the pull of all 256 sources</text>
    <text style="font-size: 6px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(238.110236 142.182692)">    from shared memory; barrier; next tile</text>
