   </g>
   <g id="text_14">
    <text style="font-size: 5.8px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(413.858268 69.219404)">Vulkan: (−1, −1) is the top left;</text>
    <text style="font-size: 5.8px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(413.858268 78.040714)">depth runs from 0 at the near</text>
    <text style="font-size: 5.8px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(413.858268 86.885134)">plane to 1 at the far plane</text>
   </g>
   <g id="text_15">
    <text style="font-size: 6.2px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(5.669291 76.214686)">OpenGL's normalised device coordinates put +y up and depth from −1 to 1, so a projection</text>
    <text style="font-size: 6.2px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(5.669291 85.647269)">matrix written for OpenGL renders upside down in Vulkan and wastes half the depth range.</text>
   </g>
