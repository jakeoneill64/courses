   <g id="text_10">
    <text style="font-size: 6.2px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(368.503937 30.897652)">1  scan each block of the input,</text>
    <text style="font-size: 6.2px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(368.503937 40.255641)">    writing each block's total</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.2px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(368.503937 76.850186)">2  scan the totals: block b's offset</text>
    <text style="font-size: 6.2px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(368.503937 86.304566)">    is the sum of blocks 0 to b − 1</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.2px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(368.503937 122.204516)">3  add each block's offset to</text>
    <text style="font-size: 6.2px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(368.503937 131.048099)">    every element of the block</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6.2px; font-family: 'Source Sans 3'; text-anchor: start; fill: #5a6472" x="11.338583" y="154.583569" transform="rotate(-0 11.338583 154.583569)">When the totals are more than one block, step 2 is the same algorithm again, one level up.</text>
   </g>
