   <g id="text_4">
    <text style="font-size: 6.2px; font-family: 'Source Sans 3'; text-anchor: middle; fill: #ffffff" x="147.401575" y="143.282283" transform="rotate(-0 147.401575 143.282283)">exclusive scan of the counts: where each block's keys of each digit start</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(49.589387 182.558498)">scatter: sort the block by digit in shared memory, stably, then write each key to</text>
    <text style="font-size: 6px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(69.462981 191.707898)">its digit's start plus its rank among that digit's keys in the block</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Source Sans 3'; text-anchor: start; fill: #003f5c" x="5.669291" y="13.181895" transform="rotate(-0 5.669291 13.181895)">One pass of the LSD radix sort, for a 4-bit digit</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.2px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(311.811024 44.97449)">count: each workgroup counts its block's</text>
    <text style="font-size: 6.2px; font-family: 'Source Sans 3'; fill: #1b2430" transform="translate(311.811024 54.42887)">keys by digit, into shared memory</text>
   </g>
