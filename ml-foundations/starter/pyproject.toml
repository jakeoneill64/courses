[project]
name = "ml-course-labs"
version = "0.1.0"
description = "Lab work for the ML Foundations course"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16",
    "openpyxl>=3.1",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "torch>=2.4",
    "torchvision>=0.19",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "tqdm>=4.66",
    "mlflow>=2.15",
    "lightgbm>=4.4",
    "xgboost>=2.1",
    "optuna>=3.6",
    "umap-learn>=0.5.6",
    "timm>=1.0",
    "gymnasium>=0.29",
    "shap>=0.46",
    "ucimlrepo>=0.0.7",
    "requests>=2.32",
    "pytest>=8.2",
    "ruff>=0.5",
]

[dependency-groups]
llm = [
    "transformers>=4.44",
    "datasets>=2.20",
    "tokenizers>=0.19",
    "accelerate>=0.33",
    "peft>=0.12",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "tiktoken>=0.7",
    "ollama>=0.3",
]
causal = [
    "dowhy>=0.11",
    "econml>=0.15",
    "statsmodels>=0.14",
]
serve = [
    "fastapi>=0.112",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxscript>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
