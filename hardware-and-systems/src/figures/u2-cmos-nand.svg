   <g id="text_5">
    <text style="font-size: 6.6px; font-family: 'Source Sans 3'; fill: #5a6472" transform="translate(37.757079 69.561619)">P-channel pair:</text>
    <text style="font-size: 6.6px; font-family: 'Source Sans 3'; fill: #5a6472" transform="translate(30.06086 79.602756)">pulls high if either</text>
    <text style="font-size: 6.6px; font-family: 'Source Sans 3'; fill: #5a6472" transform="translate(47.643672 89.690299)">input is low</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.6px; font-family: 'Source Sans 3'; fill: #5a6472" transform="translate(164.409449 143.899203)">N-channel series:</text>
    <text style="font-size: 6.6px; font-family: 'Source Sans 3'; fill: #5a6472" transform="translate(164.409449 153.31334)">pulls low only when</text>
    <text style="font-size: 6.6px; font-family: 'Source Sans 3'; fill: #5a6472" transform="translate(164.409449 163.32818)">both inputs are high</text>
   </g>
