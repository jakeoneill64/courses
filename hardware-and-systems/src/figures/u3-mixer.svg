   <g id="text_20">
    <text style="font-size: 6.6px; font-family: 'Source Sans 3'; fill: #5a6472" transform="translate(226.771654 165.448624)">R &gt; 0 rolls right (right side down);</text>
    <text style="font-size: 6.6px; font-family: 'Source Sans 3'; fill: #5a6472" transform="translate(226.771654 175.509871)">P &gt; 0 pitches the nose up;</text>
    <text style="font-size: 6.6px; font-family: 'Source Sans 3'; fill: #5a6472" transform="translate(226.771654 185.511304)">Y &gt; 0 yaws the nose right, by speeding</text>
    <text style="font-size: 6.6px; font-family: 'Source Sans 3'; fill: #5a6472" transform="translate(226.771654 195.638551)">up the counter-clockwise pair.</text>
